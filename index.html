<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>La Horde</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0c0c10">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="La Horde">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root { --tint: #1d1d2a; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; background: #000; color: #fff; overflow: hidden;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    user-select: none; -webkit-user-select: none; touch-action: none; overscroll-behavior: none;
    -webkit-tap-highlight-color: transparent;
  }
  #bg { position: fixed; inset: 0; background: radial-gradient(circle at 50% 35%, var(--tint) 0%, #000 75%); transition: background 2s ease; }
  #phone {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    height: 100dvh; aspect-ratio: 9 / 16; max-width: 100vw; overflow: hidden; background: #0c0c10;
  }
  @media (min-aspect-ratio: 10/16) {
    #phone { height: 94dvh; border-radius: 26px; box-shadow: 0 0 0 10px #111, 0 20px 80px rgba(0,0,0,.8); }
  }
  #phone.shake { animation: shake .45s; }
  #phone.shake2 { animation: shake2 .6s; }
  @keyframes shake2 { 10% { transform: translate(-53%, -50%) rotate(-1deg); } 25% { transform: translate(-47%, -52%) rotate(1deg); } 40% { transform: translate(-52.5%, -48%); } 55% { transform: translate(-48%, -51%) rotate(.5deg); } 70% { transform: translate(-51%, -49.5%); } 85% { transform: translate(-49.5%, -50.5%); } }
  .flashfx { position: absolute; inset: 0; z-index: 44; pointer-events: none; mix-blend-mode: screen; animation: flashfx .55s ease-out forwards; }
  @keyframes flashfx { from { opacity: var(--fo); } to { opacity: 0; } }
  @keyframes shake { 20% { transform: translate(-51%, -50%); } 40% { transform: translate(-49%, -51%); } 60% { transform: translate(-51%, -49%); } 80% { transform: translate(-49.5%, -50%); } }

  /* ---------- Barre du haut ---------- */
  #top { position: absolute; top: 0; left: 0; right: 0; z-index: 20; padding: calc(14px + env(safe-area-inset-top)) 14px 30px; background: linear-gradient(#000c, transparent); }
  #snd { position: absolute; right: 12px; top: calc(12px + env(safe-area-inset-top)); font-size: 18px; cursor: pointer; opacity: .8; z-index: 2; }
  #tabs { text-align: center; font-weight: 600; font-size: 16px; }
  #tabs span { opacity: .55; margin: 0 8px; cursor: pointer; position: relative; }
  #tabs span.cur { opacity: 1; border-bottom: 2px solid #e2b65c; padding-bottom: 4px; }
  #tabs span { font-family: Fell, serif; font-weight: 400; font-size: 15px; margin: 0 4px; white-space: nowrap; }
  #tabs .badge { position: absolute; top: -4px; right: -10px; width: 8px; height: 8px; border-radius: 50%; background: #c0392b; display: none; }
  #tabs .badge.on { display: block; }
  #chap { text-align: center; font-size: 12px; font-weight: 700; margin-top: 9px; letter-spacing: .02em; }
  #chap .pips { margin-left: 6px; letter-spacing: 2px; }
  #chap .bossline { color: #ffcf4a; }
  #menace { display: flex; align-items: center; gap: 6px; justify-content: center; margin-top: 5px; font-size: 12px; }
  #menace .mb { width: 150px; height: 6px; background: #fff2; border-radius: 3px; overflow: hidden; }
  #menace .mb i { display: block; height: 100%; background: linear-gradient(90deg, #ffb340, #c0392b); transition: width .5s; }
  #menace.hot .mb i { animation: hot .8s infinite alternate; }
  @keyframes hot { to { filter: brightness(1.6); } }
  #res { display: flex; justify-content: center; gap: 8px; margin-top: 7px; font-size: 13px; font-weight: 800; flex-wrap: wrap; }
  #res > span { background: #0008; border-radius: 10px; padding: 3px 9px; display: inline-flex; align-items: center; gap: 5px; }
  #res .xpb { width: 34px; height: 4px; background: #fff3; border-radius: 2px; overflow: hidden; display: inline-block; }
  #res .xpb i { display: block; height: 100%; background: #7cf; }
  #res .fire { color: #ffb340; }
  #res .fire .fl { font-style: normal; display: inline-block; transform-origin: 50% 90%; animation: flick .5s infinite alternate; }
  #res .fire.t2 { background: #5a2a00aa; box-shadow: 0 0 10px #ff8a0088; }
  #res .fire.t2 .fl { font-size: 17px; }
  #res .fire.t3 { background: linear-gradient(90deg, #7a1a00dd, #c84a00dd); box-shadow: 0 0 16px #ff6a00; color: #fff2a0; }
  #res .fire.t3 .fl { font-size: 20px; animation-duration: .28s; }
  @keyframes flick { from { transform: scale(1) rotate(-5deg); } to { transform: scale(1.2) rotate(5deg); } }
  #res > span.gup { animation: gup .5s ease-out; }
  #res > span.gdown { animation: gdown .5s ease-out; }
  @keyframes gup { 30% { transform: scale(1.3); background: #a87a00dd; box-shadow: 0 0 14px #ffcf4a; } }
  @keyframes gdown { 30% { transform: scale(.88); background: #8a1020dd; } }
  .gfly { position: absolute; z-index: 34; transform: translateX(-50%); font-weight: 900; font-size: 14px; pointer-events: none; white-space: nowrap; text-shadow: 0 2px 0 #000, 0 0 8px #000; animation: gfly 1.2s ease-out forwards; }
  .gfly.up { color: #ffd84a; } .gfly.dn { color: #ff6b81; }
  @keyframes gfly { from { opacity: 0; transform: translate(-50%, -6px) scale(.7); } 20% { opacity: 1; transform: translate(-50%, 4px) scale(1.2); } to { opacity: 0; transform: translate(-50%, 24px) scale(1); } }
  #res .buff { color: #7dffb0; font-size: 12px; }

  /* ---------- Cartes ---------- */
  @font-face { font-family: Fell; src: url(fonts/IMFellDWPica-Regular.ttf); }
  .card { position: absolute; inset: 0; overflow: hidden; background: #0c0c10; transition: transform .42s cubic-bezier(.2,.8,.2,1), opacity .42s; }
  .card.below { transform: translateX(108%) rotate(6deg); }
  .card.gone { transform: translateX(-108%) rotate(-6deg); opacity: .3; }
  .scene { position: absolute; inset: 0; background-size: cover; background-position: center; animation: drift 18s ease-in-out infinite alternate; }
  .scene, #kingdom, .village, .screen, .card img, .village img, .bld img, .album img { image-rendering: pixelated; }
  @keyframes drift { from { transform: scale(1.04) translateX(-1%); } to { transform: scale(1.1) translateX(1%); } }
  .tint { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 40%, transparent 45%, #000b 100%), var(--kt, transparent); }
  .art { position: absolute; top: var(--at, 110px); bottom: var(--ab, 50%); left: 0; right: 0; display: flex; align-items: center; justify-content: center; font-size: min(34vw, 19dvh); }
  .art span.pi { height: min(100%, 340px); aspect-ratio: 1; max-width: 86%; }
  .art img { display: block; width: 100%; height: 100%; object-fit: contain; }
  .art span { display: inline-block; animation: bob 2.6s ease-in-out infinite; filter: drop-shadow(0 18px 14px #000c) drop-shadow(0 0 30px #0006); }
  @keyframes bob { 0%,100% { transform: translateY(-4%) rotate(-3deg) scale(1); } 50% { transform: translateY(4%) rotate(3deg) scale(1.06); } }
  .card.k-boss .art span { animation: bossbob 1.4s ease-in-out infinite; }
  @keyframes bossbob { 0%,100% { transform: scale(1); } 50% { transform: scale(1.15); filter: drop-shadow(0 0 40px #f33); } }
  .grain { position: absolute; inset: 0; opacity: .12; pointer-events: none; background-image: repeating-linear-gradient(0deg, #fff1 0 1px, transparent 1px 3px); }
  .shade { position: absolute; left: 0; right: 0; bottom: 0; height: 45%; background: linear-gradient(transparent, #000c 70%); }
  .info { position: absolute; left: 10px; right: 10px; bottom: calc(10px + env(safe-area-inset-bottom)); padding: 16px 13px 12px; z-index: 2;
    background: linear-gradient(#211a10f0, #120e09f5); border: 1px solid #e2b65c77; border-radius: 14px; box-shadow: 0 10px 30px #000c, inset 0 0 0 3px #0006, inset 0 0 0 4px #e2b65c22; }
  .tag { position: absolute; top: -13px; left: 12px; font-family: Fell, serif; font-size: 14px; letter-spacing: .03em; padding: 3px 12px 2px; border-radius: 3px; background: #6b4a1c; border: 1px solid #e2b65c99; box-shadow: 0 3px 8px #0009; }
  .tag.boss { background: linear-gradient(90deg, #b3261e, #5a0d0d); }
  .tag.casino { background: #5b2a86; }
  .tag.good { background: #1f6a35; }
  .who { display: flex; align-items: center; gap: 8px; margin: 2px 0 6px; }
  .who .med img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .who .med { width: 40px; height: 40px; overflow: hidden; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; background: radial-gradient(#4a3a22, #1a140c); border: 2px solid #e2b65c; flex: none; }
  .who b { font-family: Fell, serif; font-weight: 400; font-size: 19px; color: #f3dca4; }
  .text { font-size: 14.5px; line-height: 1.4; color: #efe6d4; }
  .acts { display: flex; gap: 8px; margin-top: 10px; }
  .acts button { flex: 1; border: 0; border-radius: 10px; padding: 11px 6px; font: 800 14px system-ui, sans-serif; color: #fff; cursor: pointer; }
  .acts .pass { flex: .8; background: #ffffff14; border: 1px solid #ffffff2a; color: #e8dcc4; }
  .acts .like { background: linear-gradient(#c0392b, #8b1e2b); border: 1px solid #ff8a7a66; box-shadow: 0 3px 0 #4a0f16; }
  .acts .like.ok { background: linear-gradient(#3e9b55, #1f6a35); border-color: #8affa966; box-shadow: 0 3px 0 #0f3a1c; }
  .acts button:active, .acts button.press { transform: translateY(2px); box-shadow: none; }

  .stake { margin-top: 10px; background: #0007; border: 1px solid #e2b65c33; border-radius: 12px; padding: 8px 10px; }
  .stake .top { display: flex; justify-content: space-between; align-items: center; }
  .stake .odds { font-size: 22px; font-weight: 900; }
  .stake .odds small { font-size: 11px; font-weight: 600; opacity: .7; margin-left: 4px; }
  .stake .risk { font-size: 11px; font-weight: 800; background: #fff1; padding: 3px 7px; border-radius: 6px; }
  .stake .row { display: flex; gap: 12px; margin-top: 3px; font-weight: 800; font-size: 15px; }
  .stake .w { color: #5dff9a; } .stake .l { color: #ff6b81; }
  .hint { margin-top: 7px; font-size: 12px; opacity: .85; }
  .hint b { font-weight: 800; }

  .rail { position: absolute; right: 8px; bottom: 120px; z-index: 3; width: 54px; display: flex; flex-direction: column; align-items: center; gap: 16px; }
  .avatar { width: 48px; height: 48px; border-radius: 50%; background: #fff; border: 2px solid #fff; display: flex; align-items: center; justify-content: center; font-size: 28px; }
  .act { text-align: center; font-size: 12px; font-weight: 600; text-shadow: 0 1px 3px #000; }
  .act .ic { font-size: 30px; display: block; line-height: 1.1; }
  .heart { cursor: pointer; }
  .heart.on .ic { animation: pop .4s; }
  @keyframes pop { 50% { transform: scale(1.5); } }

  /* Jet de dés : l'aiguille balaie la barre, la zone verte est ta chance */
  .roll { position: absolute; z-index: 5; left: 8%; right: 8%; top: 30%; background: #000000ee; backdrop-filter: blur(6px); border-radius: 16px; padding: 16px 14px 14px; text-align: center; box-shadow: 0 10px 40px #000a; animation: rollin .2s ease-out; }
  @keyframes rollin { from { transform: scale(.8); opacity: 0; } }
  .track { position: relative; height: 26px; border-radius: 8px; background: #b3243c; overflow: visible; }
  .zone { position: absolute; left: 0; top: 0; bottom: 0; background: #22c06a; border-radius: 8px 0 0 8px; }
  .needle { position: absolute; top: -8px; bottom: -8px; width: 4px; margin-left: -2px; background: #fff; border-radius: 2px; box-shadow: 0 0 10px #fff; left: 50%; transition: left .13s ease-out; }
  .rres { min-height: 58px; margin-top: 12px; }
  .rres b { display: block; font-size: 28px; font-weight: 900; letter-spacing: .03em; animation: pop .45s; }
  .rres b.win { color: #5dff9a; text-shadow: 0 0 18px #22c06a; }
  .rres b.lose { color: #ff6b81; text-shadow: 0 0 18px #b3243c; }
  .rres span { font-size: 20px; font-weight: 800; }
  .rlabel { font-size: 12px; opacity: .7; margin-bottom: 8px; }
  .rlabel em { font-style: normal; font-weight: 900; } .rlabel em.up { color: #5dff9a; } .rlabel em.dn { color: #ff6b81; }
  .rres small.cmb { display: block; font-size: 13px; font-weight: 800; color: #ffb340; margin-top: 3px; }
  .roll.bossroll { border: 2px solid #ff5a5a88; }
  .roll.tense { animation: tense .42s ease-in-out infinite alternate; box-shadow: 0 0 0 2px #ffcf4aaa, 0 10px 40px #000a, 0 0 46px #ffcf4a55; }
  .roll.tense .needle { transition: left .32s cubic-bezier(.3, 1.6, .5, 1); }
  .roll.tense .zone { box-shadow: 3px 0 14px #ffcf4a; }
  @keyframes tense { from { transform: scale(1); } to { transform: scale(1.05); } }
  .roll.punch { animation: punch .35s ease-out; }
  @keyframes punch { from { transform: scale(1.14); } to { transform: scale(1); } }
  /* Combat à l'adresse : l'aiguille fait des allers-retours, tu l'arrêtes dans la zone verte */
  .roll.timing .zone { border-radius: 0; box-shadow: 0 0 12px #22c06a88; }
  .roll.timing .perf { position: absolute; top: 0; bottom: 0; width: 4%; margin-left: -2%; background: #fff8; box-shadow: 0 0 10px #fff; }
  .roll.timing .thint { display: inline-block; font-size: 22px; font-weight: 900; color: #ffcf4a; animation: dodgep .3s infinite alternate; }
  .roll.perfect { box-shadow: 0 0 0 3px #ffcf4a, 0 0 50px #ffcf4a99, 0 10px 40px #000a; }
  .combo { position: absolute; z-index: 42; left: 50%; top: 30%; transform: translateX(-50%); font-weight: 900; font-size: 28px; color: #ffb340; text-shadow: 0 0 18px #ff6a00, 0 3px 0 #7a2a00; pointer-events: none; white-space: nowrap; animation: rise 1.6s ease-out forwards; }
  .combo.lost { color: #b8c4d0; font-size: 20px; text-shadow: 0 2px 0 #000, 0 0 12px #000; }

  /* Duel de boss en temps réel */
  .bduel { position: absolute; inset: 0; z-index: 56; background: radial-gradient(circle at 50% 48%, #4a0f1af0, #000000f4 72%); display: flex; flex-direction: column; align-items: center; padding: 74px 20px 26px; touch-action: none; user-select: none; -webkit-user-select: none; animation: rollin .2s; }
  .bduel .dt { font-size: 23px; font-weight: 900; color: #ffcf4a; text-shadow: 0 0 14px #f60; text-align: center; }
  .bduel .dh { font-size: 13px; opacity: .85; text-align: center; margin: 8px 0 12px; min-height: 34px; line-height: 1.35; }
  .bduel .dbar { width: 86%; height: 16px; background: #3a0a12; border: 2px solid #ffcf4a; border-radius: 8px; overflow: hidden; }
  .bduel .dbar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #ffcf4a, #ff7a1a); transition: width .12s; }
  .bduel .dtime { width: 86%; height: 6px; background: #fff2; border-radius: 3px; overflow: hidden; margin-top: 8px; }
  .bduel .dtime i { display: block; height: 100%; width: 100%; background: #7cf; }
  .bduel .dboss { flex: 1; display: flex; align-items: center; justify-content: center; width: 100%; font-size: 120px; pointer-events: none; }
  .bduel .dboss img { width: 72%; max-width: 270px; image-rendering: pixelated; filter: drop-shadow(0 0 20px #f006); }
  .bduel .dboss.hit { animation: bhit .15s; }
  @keyframes bhit { 50% { transform: scale(.92) translateX(5px); filter: brightness(2.4); } }
  .bduel .dboss.wind { animation: wind .22s infinite alternate; }
  @keyframes wind { from { transform: scale(1.06) rotate(-3deg); filter: drop-shadow(0 0 20px #f00) brightness(1.3); } to { transform: scale(1.14) rotate(3deg); filter: drop-shadow(0 0 34px #f00) brightness(1.7); } }
  .bduel.warn { box-shadow: inset 0 0 90px #f00d; }
  .bduel .dsc { font-size: 36px; font-weight: 900; min-height: 46px; text-shadow: 0 0 14px #000; }
  .bduel .dsc b.win { color: #5dff9a; } .bduel .dsc b.lose { color: #ff6b81; }
  .dodge { position: absolute; top: 44%; width: 106px; height: 106px; border-radius: 50%; border: 3px solid #fff; background: #1a6aff; color: #fff; font-family: inherit; font-weight: 900; font-size: 15px; line-height: 1.15; box-shadow: 0 0 26px #4af; animation: dodgein .18s ease-out, dodgep .3s .18s infinite alternate; z-index: 2; }
  .dodge.l { left: 7%; } .dodge.r { right: 7%; }
  .dodge.ok { background: #22c06a; box-shadow: 0 0 30px #5dff9a; animation: none; transform: scale(1.2); }
  @keyframes dodgein { from { transform: scale(0); } }
  @keyframes dodgep { to { transform: scale(1.1); } }
  .dhit { position: absolute; z-index: 58; font-size: 30px; pointer-events: none; transform: translate(-50%, -50%); animation: dhitf .45s ease-out forwards; }
  @keyframes dhitf { from { transform: translate(-50%, -50%) scale(.4); opacity: 1; } to { transform: translate(-50%, -120%) scale(1.3); opacity: 0; } }

  /* Effets */
  .burst { position: absolute; z-index: 30; font-size: 96px; pointer-events: none; transform: translate(-50%, -50%) scale(.2) rotate(-15deg); animation: burst .7s ease-out forwards; }
  @keyframes burst { 30% { transform: translate(-50%, -50%) scale(1.15) rotate(-8deg); opacity: 1; } 100% { transform: translate(-50%, -140%) scale(1.4) rotate(5deg); opacity: 0; } }
  .gain { position: absolute; z-index: 32; left: 50%; top: 128px; transform: translateX(-50%); font-weight: 800; font-size: 15px; pointer-events: none; white-space: nowrap; background: #000b; padding: 4px 10px; border-radius: 10px; animation: gain 1.4s ease-out forwards; }
  @keyframes gain { from { opacity: 0; transform: translate(-50%, 10px); } 20% { opacity: 1; } 75% { opacity: 1; } to { opacity: 0; transform: translate(-50%, -14px); } }
  .coin { position: absolute; z-index: 33; font-size: 26px; pointer-events: none; animation: coin 1s ease-in forwards; }
  @keyframes coin { 0% { transform: translate(0, 0) scale(.6); opacity: 0; } 15% { opacity: 1; transform: translate(calc(var(--dx) * .3), 30px) scale(1.2); } 100% { transform: translate(var(--dx), var(--dy)) scale(.5); opacity: .2; } }
  .toast { position: absolute; z-index: 40; left: 50%; top: 22%; transform: translateX(-50%); width: 86%; text-align: center; font-weight: 900; font-size: 22px; line-height: 1.25; background: linear-gradient(135deg, #3a1e70ee, #1a0c33ee); border: 2px solid #ffcf4a; border-radius: 18px; padding: 16px; pointer-events: none; animation: toast 2.6s ease-out forwards; }
  .toast small { display: block; font-size: 13px; font-weight: 600; opacity: .85; margin-top: 6px; }
  @keyframes toast { from { opacity: 0; transform: translate(-50%, 20px) scale(.8); } 12% { opacity: 1; transform: translate(-50%, 0) scale(1.04); } 20% { transform: translate(-50%, 0) scale(1); } 85% { opacity: 1; } to { opacity: 0; } }
  .jackpot { position: absolute; z-index: 41; left: 50%; top: 14%; transform: translateX(-50%); font-weight: 900; font-size: 34px; color: #ffcf4a; text-shadow: 0 0 20px #f90, 0 3px 0 #a50; pointer-events: none; white-space: nowrap; animation: rise 1.6s ease-out forwards; }
  @keyframes rise { from { opacity: 0; transform: translate(-50%, 20px) scale(.6); } 25% { opacity: 1; transform: translate(-50%, 0) scale(1.15); } to { opacity: 0; transform: translate(-50%, -40px) scale(1); } }
  #phone.danger::after { content: ''; position: absolute; inset: 0; z-index: 19; pointer-events: none; box-shadow: inset 0 0 60px #f0244a88; animation: hot 1s infinite alternate; }

  /* ---------- Royaume ---------- */
  #kingdom { position: absolute; inset: 0; z-index: 15; overflow-y: auto; padding: 150px 16px 30px; background: linear-gradient(#0a0c0899, #0b0a08ee 30%, #0a0908 55%), url(bg/royaume.png) center top / 100% auto no-repeat, #0a0908; }
  #kingdom.hidden { display: none; }
  .castle { text-align: center; font-size: 80px; line-height: 1; }
  .kname { text-align: center; font-family: Fell, serif; font-weight: 400; font-size: 26px; margin-top: 8px; color: #f3dca4; }
  .kera { text-align: center; font-size: 12px; opacity: .65; margin-bottom: 10px; }
  .kstats { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 14px; }
  .kstats div { background: #ffffff0d; border-radius: 10px; padding: 7px 9px; font-size: 11px; opacity: .9; }
  .kstats b { display: block; font-size: 15px; }
  .bld { display: flex; gap: 12px; align-items: center; background: #ffffff10; border-radius: 14px; padding: 10px 12px; margin-bottom: 9px; }
  .bld .be { font-size: 32px; width: 40px; text-align: center; }
  .bld .bt { flex: 1; font-size: 12px; line-height: 1.35; }
  .bld .bt b { font-size: 14px; }
  .bld .bt .lv { opacity: .6; font-weight: 600; margin-left: 4px; }
  .bld button { border: 0; border-radius: 10px; padding: 8px 10px; font-weight: 800; font-size: 12px; font-family: inherit; background: #2fbf71; color: #fff; cursor: pointer; min-width: 78px; line-height: 1.3; }
  .bld button:disabled { background: #ffffff1a; color: #fff8; cursor: default; }
  .khint { text-align: center; font-size: 12px; opacity: .6; margin-top: 8px; }

  #kingdom { touch-action: pan-y; }
  .ktabs { display: flex; gap: 6px; margin: 10px 0 12px; }
  .ktabs span { flex: 1; text-align: center; font-size: 12px; font-weight: 800; padding: 8px 0; border-radius: 10px; background: #ffffff12; cursor: pointer; }
  .ktabs span.on { background: #e2b65c; color: #1a1208; }
  .village { position: relative; height: 170px; border-radius: 14px; overflow: hidden; background: url(bg/village.png) center 70% / cover, #2a3a20; border: 1px solid #e2b65c66; box-shadow: 0 8px 24px #000a; }

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const fmt = n => { n = Math.round(n); return n >= 1e6 ? (n / 1e6).toFixed(1).replace('.0', '') + 'M' : n >= 1e5 ? Math.round(n / 1e3) + 'k' : String(n); };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const roman = n => { const m = [[10, 'X'], [9, 'IX'], [5, 'V'], [4, 'IV'], [1, 'I']]; let s = ''; for (const [v, r] of m) while (n >= v) { s += r; n -= v; } return s; };
function wpick(pairs) { const t = pairs.reduce((s, p) => s + p[1], 0); let r = Math.random() * t; for (const p of pairs) { if ((r -= p[1]) < 0) return p[0]; } return pairs[0][0]; }

const PETS = {

};
const PETB = { ch: '% de chance', g: "% d'or", l: '% de pertes', xp: "% d'XP", lo: "% d'objets", cr: '% de critique' };
// Un familier qui t'accompagne 100 cartes gagne un niveau (max 5) : +25 % sur tous ses bonus par niveau
const petLvl = k => Math.min(5, 1 + Math.floor(((G.petXp || {})[k] || 0) / 100));
const petMul = k => (1 + .25 * (petLvl(k) - 1)) * (1 + .1 * (G.up.menagerie || 0));
const petDesc = k => Object.entries(PETS[k].b).map(([s, v]) => `${s === 'l' ? '−' : '+'}${Math.round(v * petMul(k) * 10) / 10} ${PETB[s]}`).join(' · ');
const petB = s => G.pet && PETS[G.pet] && PETS[G.pet].b[s] ? PETS[G.pet].b[s] * petMul(G.pet) : 0;
const rarSpan = r => `<span style="color:${RAR[r].c}">${RAR[r].n.toLowerCase()}</span>`;
// Rareté d'un œuf : b augmente les chances d'un œuf rare (boss, Vorthax, longues expéditions)
const eggRar = (b = 0) => wpick([[0, Math.max(10, 52 - 12 * b)], [1, 30], [2, 12 + 4 * b], [3, 4 + 3 * b], [4, 1 + 1.5 * b]]);
function giveEgg(src, b = 0) {
  const r = eggRar(b);
  G.eggs.push({ left: 200, r });
  later(() => { toast(`🥚 ŒUF ${RAR[r].n} !<small>${src} · il éclora dans 200 cartes (Royaume → Familiers)</small>`, 'achv'); sfx.reveal(Math.min(r, 4)); }, 700);
}
function hatch(e) {
  const r = e.r == null ? eggRar() : e.r;
  const ks = Object.keys(PETS).filter(k => PETS[k].r === r && k !== 'loup' && !G.pets[k]);
  if (!ks.length) { const v = [20, 40, 80, 160, 320][r]; G.shards += v; toast(`🥚 L'ŒUF ${RAR[r].n} ÉCLOT…<small>un familier que tu as déjà ! Il est échangé contre ${v} 💎 éclats</small>`, 'achv'); return; }
  const k = pick(ks); G.pets[k] = 1;
  const better = !G.pet || PETS[k].r > PETS[G.pet].r; if (better) G.pet = k;
  toast(`🐣 ${PETS[k].n.toUpperCase()} ${RAR[r].n} !<small>${petDesc(k)}${better ? ' · il te suit déjà' : ' · choisis-le dans Royaume → Familiers'}</small>`, 'achv'); sfx.reveal(r);
}

function addXp(x) {
  x = Math.round(x * (1 + .15 * G.perm.xp + .1 * G.up.taverne) * (1 + petB('xp') / 100));

  let bonus = 0;
  while (G.xp >= xpNeed()) {
    G.xp -= xpNeed(); G.lvl++;
    const g = Math.round(20 * G.lvl * mult()); bonus += g; G.gold += g;
  }
  return bonus;
}

// Auto-clic (règne IV) : joue les cartes à ta place, prudemment
let autoOn = false, autoLast = null, autoN = 0;
function autoIcon() { const a = $('auto'); a.classList.toggle('lockd', !LOCKS.auto()); a.classList.toggle('on', autoOn); a.classList.toggle('off', !autoOn); }
function toggleAuto() {
  if (!LOCKS.auto()) { lockInfo('auto'); return; }
  autoOn = !autoOn; autoIcon(); floatTxt(autoOn ? '🤖 Auto-clic activé' : '🖐️ Auto-clic coupé');
}
$('auto').onclick = e => { e.stopPropagation(); toggleAuto(); };
function autoStep() {
  if (!autoOn || !started || view !== 'feed' || !cur || busy || document.querySelector('.pack, .ask')) return;
  const c = cur;
  if (c === autoLast) { if (++autoN > 3) { autoOn = false; autoIcon(); floatTxt('🖐️ Auto-clic en pause : à toi de jouer'); return; } } else { autoLast = c; autoN = 0; }
  const need = o => o.stake ? (o.stake.mise ? o.stake.lose : 0) : o.cost || 0;
  if (c.opts) {
    let i = c.opts.findIndex(o => o.ok !== false && G.gold >= need(o) && (!o.stake || o.stake.chance >= 50));
    if (i < 0) i = c.opts.findIndex(o => o.ok !== false && G.gold >= need(o) && !o.stake);
    if (i >= 0) pickOpt(i); return;
  }
  if (c.wheel) { choose(false); return; }
  if (c.stake) { choose((c.stake.chance >= 50 || c.kind === 'boss') && G.gold >= need(c.stake.mise ? { stake: c.stake } : {})); return; }
  choose(G.gold >= (c.cost || 0));
}
setInterval(autoStep, 900);

// Installation sur téléphone (PWA)
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});
let installEv = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEv = e; $('install').classList.remove('hidden'); });
$('install').onclick = async () => {
  if (!installEv) return;
  installEv.prompt(); await installEv.userChoice; installEv = null;
  $('install').classList.add('hidden');
};
</script>
